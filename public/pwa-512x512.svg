<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="planet" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0f172a"/>
  <circle cx="256" cy="256" r="80" fill="#a855f7" opacity="0.25" filter="url(#softglow)"/>
  <circle cx="256" cy="256" r="53" fill="url(#planet)"/>
  <g transform="rotate(-25 256 256)">
    <ellipse cx="256" cy="256" rx="165" ry="64" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="421" cy="256" r="19" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>