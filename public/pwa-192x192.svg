<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="planet" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="192" height="192" fill="#0f172a"/>
  <circle cx="96" cy="96" r="30" fill="#a855f7" opacity="0.25" filter="url(#softglow)"/>
  <circle cx="96" cy="96" r="20" fill="url(#planet)"/>
  <g transform="rotate(-25 96 96)">
    <ellipse cx="96" cy="96" rx="62" ry="24" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="158" cy="96" r="7" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
